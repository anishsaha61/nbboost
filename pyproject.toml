[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nbboost"
dynamic = ["version"]
description = "Power-ups for Jupyter notebooks: interactive result tables, charts and column profiling, %sql, and df.display() for Spark and pandas."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Anish Saha" }]
keywords = ["jupyter", "jupyterlab", "ipython", "notebook", "pyspark", "spark-connect", "pandas", "data-visualization", "sql-magic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: IPython",
  "Framework :: Jupyter",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["ipython>=8.6"]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
pandas = ["pandas>=1.5"]
widgets = ["ipywidgets>=8"]
notebook = ["nbclient>=0.7", "nbformat>=5", "ipykernel>=6"]
all = ["pyspark>=3.5", "pandas>=1.5", "ipywidgets>=8", "nbclient>=0.7", "nbformat>=5", "ipykernel>=6"]
test = ["pytest>=8", "pytest-cov", "pandas>=1.5", "playwright", "ipywidgets>=8", "nbclient>=0.7", "nbformat>=5", "ipykernel>=6"]

[project.urls]
Homepage = "https://github.com/anishsaha61/nbboost"
Issues = "https://github.com/anishsaha61/nbboost/issues"

[tool.hatch.version]
path = "src/nbboost/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nbboost"]
exclude = ["src/nbboost/labextension"]

# The JupyterLab extension is prebuilt (labextension/ -> src/nbboost/labextension, see README)
# so that installing from git needs no Node.js.
[tool.hatch.build.targets.wheel.shared-data]
"src/nbboost/labextension" = "share/jupyter/labextensions/nbboost"
"labextension/install.json" = "share/jupyter/labextensions/nbboost/install.json"

[tool.hatch.build.targets.sdist]
exclude = ["labextension/node_modules", "labextension/lib", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "browser: headless-browser smoke tests (need Playwright + Chromium)",
  "jupyterlab: end-to-end tests of the JupyterLab extension (need JupyterLab + Playwright)",
]
