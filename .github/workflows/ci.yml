name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
        extras: ["test", "test,spark"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v4
        if: contains(matrix.extras, 'spark')
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: pip install -e ".[${{ matrix.extras }}]"
      - name: Install Chromium for browser smoke tests
        run: python -m playwright install --with-deps chromium
      - name: Test
        run: >
          pytest -ra --junitxml=test-results.xml
          --cov=nbboost --cov-report=xml --cov-report=term-missing --cov-report=html
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-py${{ matrix.python }}-${{ matrix.extras == 'test' && 'core' || 'spark' }}
          path: |
            test-results.xml
            coverage.xml
            htmlcov/

  labextension:
    # Builds the JupyterLab extension, checks the committed build is current, and runs it in a real JupyterLab.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: labextension/package-lock.json
      - name: Install JupyterLab and build tools
        run: pip install "jupyterlab>=4,<5"
      - name: Build the extension
        working-directory: labextension
        run: |
          npm ci
          npm run build
      - name: Committed build is up to date
        run: |
          if [ -n "$(git status --porcelain src/nbboost/labextension)" ]; then
            git status --porcelain src/nbboost/labextension
            echo "::error::src/nbboost/labextension is out of date: run 'npm run build' in labextension/ and commit the result"
            exit 1
          fi
      - name: Install nbboost (regular install, so the extension lands in share/jupyter)
        run: pip install ".[test]"
      - run: jupyter labextension list
      - run: python -m playwright install --with-deps chromium
      - name: End-to-end test in JupyterLab
        run: pytest -m jupyterlab tests/test_labextension.py -ra --junitxml=labextension-results.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-labextension
          path: labextension-results.xml
