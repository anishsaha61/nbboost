name: Release

# Runs when a version tag is pushed (e.g. v0.2.0): re-runs the tests, builds the package,
# and creates a GitHub Release with the test evidence and build files attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: pip install -e ".[test,spark]" build
      - run: python -m playwright install --with-deps chromium
      - name: Check tag matches package version
        run: |
          v=$(python -c "import nbboost; print(nbboost.__version__)")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package version v$v"; exit 1; }
      - name: Test
        run: pytest -ra --junitxml=test-results.xml --cov=nbboost --cov-report=xml --cov-report=term
      - name: Build
        run: python -m build
      - name: Write evidence summary
        run: python scripts/test_report.py test-results.xml coverage.xml > test-report.md
      - name: Extract changelog section
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\["v"\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release-notes.md
          { echo; echo "---"; cat test-report.md; } >> release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/* test-results.xml coverage.xml test-report.md
          --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
